site_name: '@juspay/kriya'
site_description: Browser automation with typed task decisions, scoped execution, approvals and checked outcomes.
site_author: juspay-maintainers
site_url: https://juspay.github.io/kriya/

# Repository
repo_name: kriya
repo_url: https://github.com/juspay/kriya
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2023 - 2026 juspay-maintainers

# Configuration
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juspay/kriya
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@juspay/kriya

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: juspay
      repo: kriya
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Integration:
      - Start here: integration/index.md
      - Browser engine: integration/browser-engine.md
      - In page: integration/in-page.md
      - Node and Playwright: integration/node-playwright.md
      - Configuration: integration/configuration.md
      - Lifecycle and approvals: integration/lifecycle.md
      - Security and verification: integration/security.md
      - Extension seams: integration/extensions.md
      - Operations: integration/operations.md
      - Migration: integration/migration.md
  - TaskAgent Guide: task-agent.md
  - Verification Status: task-agent-status.md
  - Public Contract: task-agent-contract.md
  - Generated API: api-generated/README.md
