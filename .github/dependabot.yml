version: 2
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    open-pull-requests-limit: 5
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'maintenance'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    reviewers:
      - 'juspay-maintainers'
    assignees:
      - 'juspay-maintainers'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # Ignore major version updates for these packages
      - dependency-name: 'eslint'
        versions: ['>= 10.a']
      - dependency-name: 'prettier'
        versions: ['>= 4.a', '< 5']

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'maintenance'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    reviewers:
      - 'juspay-maintainers'
    labels:
      - 'github-actions'
      - 'automated'

  # Enable version updates for Docker if Dockerfile exists
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    reviewers:
      - 'juspay-maintainers'
    commit-message:
      prefix: 'docker'
    labels:
      - 'docker'
      - 'automated'
