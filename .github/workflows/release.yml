name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm provenance via OIDC

jobs:
  test:
    name: 🧪 Pre-release Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  release:
    name: 🚀 Release
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for native OIDC publish support
        run: |
          npx -y npm@11 install -g npm@11
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Release with semantic-release
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: '0'

      - name: Setup Node for GitHub Packages
        if: success()
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@juspay'

      - name: Publish to GitHub Packages
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "📦 Publishing to GitHub Packages..."
          LOG=$(npm publish --access public --registry https://npm.pkg.github.com 2>&1)
          STATUS=$?
          echo "$LOG"

          if [ $STATUS -eq 0 ]; then
            echo "✅ Published to GitHub Packages"
            exit 0
          fi

          # semantic-release didn't bump the version on this run, so the tag
          # already exists on the registry. That's expected when `npx
          # semantic-release` produces no release (e.g. chore-only commit) —
          # don't fail the job.
          if echo "$LOG" | grep -qE 'EPUBLISHCONFLICT|cannot publish over the previously published versions|409'; then
            echo "ℹ️  Version already exists on GitHub Packages — no new release to publish."
            exit 0
          fi

          echo "❌ GitHub Packages publish failed with exit code $STATUS"
          exit $STATUS
