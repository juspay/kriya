name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js for dependency installation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Node.js ${{ matrix.node-version }} for compatibility checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check code formatting
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm run build

  build-check:
    name: 📦 Build & Package Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Test contributor tooling
        run: pnpm run test:tooling

      - name: Verify consumer package
        run: pnpm run verify:package

      - name: Install integration browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify integration examples
        run: pnpm run docs:verify

      - name: Verify package contents
        run: |
          echo "📦 Dry-run packaging:"
          pnpm pack --dry-run
          echo ""
          echo "📂 dist/ contents:"
          ls -la dist/

  package-windows:
    name: 📦 Windows Package Check
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Test contributor tooling
        run: pnpm run test:tooling

      - name: Verify consumer package
        run: pnpm run verify:package

  quality-gate:
    name: 🛡️ Code Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Build validation
        run: node scripts/build-validations.cjs

      - name: 📝 Commit message validation
        # On pull_request events, actions/checkout defaults to the ephemeral
        # merge commit (refs/pull/N/merge), so `git log -1` would return
        # "Merge … into …" — not the contributor's commit. Resolve the
        # contributor SHA explicitly.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${HEAD_SHA:-}" ]; then
            COMMIT_SHA="$HEAD_SHA"
          else
            COMMIT_SHA="HEAD"
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$COMMIT_SHA")
          echo "Validating: $COMMIT_MSG"
          node scripts/commit-validation.cjs "$COMMIT_MSG"

      - name: 🌍 Environment validation
        run: node scripts/env-validation.cjs

      - name: 🔒 Security check
        run: node scripts/security-check.cjs

      - name: 📈 TypeScript strict check
        run: pnpm exec tsc --noEmit --incremental false --strict --project tsconfig.json

      - name: 📊 Quality metrics (non-blocking)
        id: metrics
        continue-on-error: true
        run: node scripts/quality-metrics.cjs --json-only

      - name: 📤 Upload quality metrics artifact
        if: always() && hashFiles('quality-metrics.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-metrics-${{ github.sha }}
          path: quality-metrics.json
          retention-days: 14

      - name: 📋 Quality summary
        if: always()
        run: |
          echo "📋 Quality Gate Summary:"
          echo "✅ Build validation"
          echo "✅ Commit message format"
          echo "✅ Environment validation"
          echo "✅ Security check"
          echo "✅ TypeScript strict compilation"
          if [ -f quality-metrics.json ]; then
            echo ""
            echo "📊 Quality snapshot:"
            node -e "const m=require('./quality-metrics.json'); console.log('  Files:',m.files.fileCount,' LOC:',m.files.loc.code); console.log('  ESLint errors:',m.eslint.errors,' warnings:',m.eslint.warnings); console.log('  TODOs:',m.todos.total); console.log('  Audit critical:',m.audit.critical,' high:',m.audit.high);"
          fi
